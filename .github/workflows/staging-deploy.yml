name: Staging Deploy

# Build Phase 15 Wave 1 (staging deployment preparation).
#
# MANUALLY TRIGGERED ONLY (workflow_dispatch) — never on push to main. This
# is deliberate: the approval brief for this build phase says "do not
# deploy to production," and staging itself should be an explicit, reviewed
# action a human takes, not something that happens silently on every merge.
#
# THIS WORKFLOW HAS NEVER BEEN RUN. This sandboxed build environment has no
# Vercel account, no Supabase project (staging or otherwise), and no
# Anthropic/Resend/Sentry credentials of any kind — every step below is
# genuinely correct GitHub Actions YAML, carefully hand-validated, but none
# of it has been executed against a real cloud account. Once the required
# secrets (listed below) are configured as GitHub Actions secrets on this
# repository, running this workflow is a matter of triggering it — no new
# infrastructure code should be needed.
#
# ---------------------------------------------------------------------------
# REQUIRED GITHUB ACTIONS SECRETS (Settings → Secrets and variables →
# Actions → Repository secrets). The "Validate required secrets" job below
# fails fast, naming exactly which of these is missing, rather than letting
# a later step fail with a cryptic downstream error.
#
# Vercel (staging-specific project — see "deploy-vercel" job below for why
# this must be a DEDICATED staging Vercel project, never the production one):
#   VERCEL_TOKEN                    — a Vercel personal/team access token
#   VERCEL_ORG_ID                   — the Vercel team/org id
#   VERCEL_PROJECT_ID               — the STAGING Vercel project's id
#
# Supabase (staging project only — never the production project ref):
#   SUPABASE_STAGING_PROJECT_REF    — the staging Supabase project ref
#   SUPABASE_STAGING_DB_PASSWORD    — the staging project's Postgres password
#   SUPABASE_STAGING_ACCESS_TOKEN   — a Supabase personal access token
#                                      (supabase login), used by the CLI
#   STAGING_SUPABASE_URL            — staging project URL, for the seed step
#                                      (NEXT_PUBLIC_SUPABASE_URL at runtime is
#                                      configured directly on the Vercel
#                                      project instead — see below)
#   STAGING_SUPABASE_SERVICE_ROLE_KEY — staging service role key, for the
#                                      seed step only (never exposed to the
#                                      client bundle, same rule as prod)
#
# AI / outreach / monitoring (staging-scoped credentials):
#   STAGING_ANTHROPIC_API_KEY       — required; without it staging would
#                                      silently run in AI-not-configured mode,
#                                      defeating the point of a staging
#                                      environment meant to validate the AI
#                                      workflows
#   STAGING_RESEND_API_KEY          — OPTIONAL. If unset, staging runs with
#                                      outreach email in the existing
#                                      "development adapter" safe mode
#                                      (lib/outreach/channels/email.ts) —
#                                      this is treated as a deliberate choice,
#                                      not a missing-secret failure
#   STAGING_SENTRY_DSN              — OPTIONAL but recommended; unset means
#                                      no error tracking on staging, which is
#                                      allowed but produces a warning
#
# Deployment identity:
#   STAGING_APP_URL                 — the staging deployment's public URL
#                                      (e.g. https://staging-rqi.example.com
#                                      or the Vercel-assigned domain already
#                                      attached to the staging project), used
#                                      as NEXT_PUBLIC_APP_URL at build time
#
# NOTE on app runtime env vars (NEXT_PUBLIC_SUPABASE_URL,
# NEXT_PUBLIC_SUPABASE_ANON_KEY, ANTHROPIC_API_KEY, RESEND_API_KEY,
# SENTRY_DSN, etc.): these must be configured directly on the staging Vercel
# project itself (Project Settings → Environment Variables → Preview), the
# standard Vercel-managed way, so `vercel pull`/`vercel build` below picks
# them up automatically. This workflow does not push them there — Vercel has
# no API well-suited to "set this secret" from CI without re-exposing it in
# workflow logs, and the Vercel dashboard is the documented, auditable place
# to manage them. The STAGING_* GitHub secrets above exist for what GitHub
# Actions itself needs directly: authenticating the Vercel/Supabase CLIs,
# and running the seed script from the runner.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      run_seed:
        description: "Seed staging with synthetic demo data after deploying (do NOT enable on a routine re-deploy — duplicates demo data; seed-staging.ts is not idempotent by design, see that file's header)"
        type: boolean
        default: false

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  validate-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check all required secrets are present
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
          SUPABASE_STAGING_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_ANTHROPIC_API_KEY: ${{ secrets.STAGING_ANTHROPIC_API_KEY }}
          STAGING_APP_URL: ${{ secrets.STAGING_APP_URL }}
          # Optional — checked separately below, only to print a warning.
          STAGING_RESEND_API_KEY: ${{ secrets.STAGING_RESEND_API_KEY }}
          STAGING_SENTRY_DSN: ${{ secrets.STAGING_SENTRY_DSN }}
        run: |
          set -euo pipefail
          missing=()
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID \
                      SUPABASE_STAGING_PROJECT_REF SUPABASE_STAGING_DB_PASSWORD SUPABASE_STAGING_ACCESS_TOKEN \
                      STAGING_SUPABASE_URL STAGING_SUPABASE_SERVICE_ROLE_KEY \
                      STAGING_ANTHROPIC_API_KEY STAGING_APP_URL; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::The following required secret(s) are not set on this repository: ${missing[*]}"
            echo "See the comment block at the top of .github/workflows/staging-deploy.yml for what each one is and where it comes from."
            exit 1
          fi

          echo "All required secrets are present."

          if [ -z "${STAGING_RESEND_API_KEY:-}" ]; then
            echo "::warning::STAGING_RESEND_API_KEY is not set — staging will run outreach email in the existing development-adapter safe mode, not live delivery."
          fi
          if [ -z "${STAGING_SENTRY_DSN:-}" ]; then
            echo "::warning::STAGING_SENTRY_DSN is not set — staging will have no error tracking."
          fi

  run-ci:
    needs: validate-secrets
    uses: ./.github/workflows/ci.yml

  compute-release-identity:
    needs: run-ci
    runs-on: ubuntu-latest
    outputs:
      build_sha: ${{ steps.identity.outputs.build_sha }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
    steps:
      - name: Compute git SHA and release tag
        id: identity
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          timestamp="$(date -u +%Y%m%d-%H%M%S)"
          tag="staging-${timestamp}-${short_sha}"
          echo "build_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${tag}" >> "$GITHUB_OUTPUT"

  migrate-staging:
    needs: compute-release-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply pending migrations to the STAGING Supabase project ONLY
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
          STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
        run: |
          set -euo pipefail
          # THIS STEP MUST NEVER BE POINTED AT A PRODUCTION PROJECT REF.
          # STAGING_PROJECT_REF comes only from the SUPABASE_STAGING_PROJECT_REF
          # secret (see the comment block at the top of this file) — there is
          # no production-project secret anywhere in this workflow for it to
          # be confused with, by design.
          supabase link --project-ref "$STAGING_PROJECT_REF"
          # Idempotent: `db push` only applies migrations the target project
          # hasn't already recorded as applied (Supabase's own
          # supabase_migrations.schema_migrations tracking table) — safe to
          # re-run this workflow without reapplying or duplicating anything.
          supabase db push

  deploy-vercel:
    needs: [migrate-staging, compute-release-identity]
    runs-on: ubuntu-latest
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project environment (Preview) — reads env vars configured on the staging Vercel project's dashboard
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # Baked in at build time — apps/web/lib/env.ts's getBuildInfo().
          # These two are the only env vars this workflow injects itself;
          # everything else the app reads comes from the Vercel project's
          # own configured env vars (pulled above).
          NEXT_PUBLIC_BUILD_SHA: ${{ needs.compute-release-identity.outputs.build_sha }}
          NEXT_PUBLIC_RELEASE_TAG: ${{ needs.compute-release-identity.outputs.release_tag }}
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output to the STAGING Vercel project (Preview environment)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          # --prod=false deploys to this project's Preview environment, not
          # its Production environment. This is safe specifically because
          # VERCEL_PROJECT_ID must point at a Vercel project DEDICATED to
          # staging — a project distinct from whatever project (if any)
          # serves real production traffic — never the same project with a
          # different flag. A Preview deployment here is idempotent-safe to
          # re-run: each run creates a new immutable deployment URL and
          # never mutates a prior one.
          url="$(vercel deploy --prebuilt --prod=false --token="$VERCEL_TOKEN")"
          echo "deployment_url=${url}" >> "$GITHUB_OUTPUT"
          echo "Deployed: ${url}"

      - name: Alias deployment to the stable staging URL, if one is configured
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          STAGING_APP_URL: ${{ secrets.STAGING_APP_URL }}
        run: |
          set -euo pipefail
          # validate-secrets already requires STAGING_APP_URL to be set, so
          # this is always populated in practice — the emptiness check below
          # is only a defensive fallback (e.g. a future change that makes
          # the secret optional) rather than something expected to trigger.
          if [ -z "${STAGING_APP_URL:-}" ]; then
            echo "STAGING_APP_URL not set — skipping alias step, ephemeral deployment URL above is still live."
            exit 0
          fi
          # Re-pointing an alias is itself idempotent — repeating this
          # command just repoints the same alias at the latest deployment,
          # never duplicates or corrupts anything. Requires STAGING_APP_URL's
          # domain to already be added to this Vercel project in the
          # dashboard (Vercel does not let an arbitrary unclaimed domain be
          # aliased from the CLI) — a one-time manual setup step, not
          # something this workflow can do on its own.
          domain="${STAGING_APP_URL#https://}"
          domain="${domain#http://}"
          vercel alias set "${{ steps.deploy.outputs.deployment_url }}" "$domain" --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" || \
            echo "::warning::Aliasing to $domain failed — confirm that domain is already attached to this Vercel project in its dashboard. The ephemeral deployment URL above is still live."

  tag-release:
    needs: [compute-release-identity, deploy-vercel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create and push the release tag
        env:
          RELEASE_TAG: ${{ needs.compute-release-identity.outputs.release_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The tag name embeds a timestamp + short SHA (see
          # compute-release-identity), so a collision on re-run is not a
          # realistic concern — each run produces its own unique tag rather
          # than requiring a force-push or overwrite of a previous one.
          git tag -a "$RELEASE_TAG" -m "Staging deploy ${RELEASE_TAG}"
          git push origin "$RELEASE_TAG"

  seed-staging:
    needs: [deploy-vercel, migrate-staging]
    if: ${{ github.event.inputs.run_seed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Seed staging with synthetic demo data
        env:
          ALLOW_STAGING_SEED: 'true'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm --filter web seed:staging

  summary:
    needs: [compute-release-identity, deploy-vercel, tag-release]
    if: always() && needs.deploy-vercel.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Post deployment summary
        env:
          DEPLOYMENT_URL: ${{ needs.deploy-vercel.outputs.deployment_url }}
          RELEASE_TAG: ${{ needs.compute-release-identity.outputs.release_tag }}
          BUILD_SHA: ${{ needs.compute-release-identity.outputs.build_sha }}
        run: |
          {
            echo "## Staging deploy summary"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Deployed URL | ${DEPLOYMENT_URL} |"
            echo "| Release tag | ${RELEASE_TAG} |"
            echo "| Git SHA | ${BUILD_SHA} |"
            echo "| Migrations applied | via \`supabase db push\` against \`SUPABASE_STAGING_PROJECT_REF\` in the migrate-staging job above |"
            echo "| Seed run | ${{ github.event.inputs.run_seed == 'true' && 'yes — see seed-staging job log' || 'no (run_seed input was false)' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
